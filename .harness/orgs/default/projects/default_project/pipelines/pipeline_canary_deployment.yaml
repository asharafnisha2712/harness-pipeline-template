pipeline:
  description: Canary deployment of the nginx service to Kubernetes at 50 percent of replicas, followed by canary cleanup and a rolling rollout
  stages:
    - steps:
        - name: Kubernetes Canary Deploy
          id: k8sCanaryDeployStep
          template:
            uses: k8sCanaryDeployStep
            with:
              unit: percentage
              instances: "50"
              skip_dry_run: false
              traffic_shift: false
              manifests: ${{runtime.manifestPath}}
              kubeconfig: ${{infra.kube_config_path}}
              namespace: ${{infra.namespace}}
              release: ${{infra.releaseName}}
              apply_timeout: 5m
              log_level: info
              skip_steady_state_check: false
              steady_state_timeout: 5m
              describe_resources: false
              print_manifests: false
              server_side_apply: false
              pruning: false
              skip_resource_versioning: false
        - name: Kubernetes Canary Delete
          id: k8sCanaryDeleteStep
          template:
            uses: k8sCanaryDeleteStep
            with:
              resources: ${{stage.steps.k8sCanaryDeployStep.output.outputVariables.canaryWorkloads}}
              is_openshift: ${{stage.steps.k8sCanaryDeployStep.output.outputVariables.isOpenshift}}
        - name: Kubernetes Rolling Deploy
          id: k8sRollingDeployStep
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            steps:
              - name: Kubernetes Canary Rollback Delete
                id: k8sCanaryRollbackDeleteStep
                template:
                  uses: k8sCanaryDeleteStep
                  with:
                    select_delete_resources: resources
                    resources: ${{rollback.data.PLUGIN_CANARY_WORKLOADS}}
                    is_openshift: ${{rollback.data.HARNESS_IS_OPENSHIFT}}
              - name: Kubernetes Rolling Rollback
                id: k8sRollingRollbackStep
                template:
                  uses: k8sRollingRollbackStep
          id: k8sCanaryRollback
          name: Kubernetes Canary Rollback
      on-failure:
        errors: all
        action: stage-rollback
      name: deployment
      id: deployment
      service:
        type: kubernetes
        items:
          - nginx_canary_service
      environment:
        items:
          - id: environment_test
            all-infra: true
            deploy-to: <+input>
      runtime:
        kubernetes:
          namespace: harness-demo
          connector: connector_K8sCluster_c1c5
      clone:
        ref:
          type: branch
          name: develop
        enabled: true
